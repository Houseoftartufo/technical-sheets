name: Sync supplier technical sheets

on:
  workflow_dispatch:
    inputs:
      publish_to_production:
        description: Publish to the official site after the Vercel Git preview passes
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: supplier-drive-sync
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  deployments: read
  statuses: read

jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      status: ${{ steps.watch.outputs.status }}
      step_outcome: ${{ steps.watch.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Drive watcher dependencies
        run: pip install google-api-python-client google-auth
      - name: Maintain Google Drive push channel
        id: watch
        continue-on-error: true
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_IMPERSONATED_USER: ${{ secrets.GOOGLE_DRIVE_IMPERSONATED_USER }}
          DRIVE_SOURCE_FOLDER_ID: ${{ vars.DRIVE_SOURCE_FOLDER_ID || secrets.DRIVE_SOURCE_FOLDER_ID }}
          DRIVE_WEBHOOK_URL: ${{ vars.DRIVE_WEBHOOK_URL }}
          DRIVE_WEBHOOK_TOKEN: ${{ secrets.DRIVE_WEBHOOK_TOKEN }}
        run: python _BUILD/ensure_drive_watch.py

  sync:
    needs: watch
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      deployments: read
      statuses: read
    env:
      DRIVE_RUN_DIR: /tmp/technical-sheets-run
      DRIVE_GENERATED_DIR: /tmp/technical-sheets-generated
      SITE_BUNDLE_DIR: /tmp/technical-sheets-site
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install importer and PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 poppler-utils libreoffice-writer
          pip install -r requirements-drive.txt
      - name: Prepare sync run
        id: prepare
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_IMPERSONATED_USER: ${{ secrets.GOOGLE_DRIVE_IMPERSONATED_USER }}
          DRIVE_SOURCE_FOLDER_ID: ${{ vars.DRIVE_SOURCE_FOLDER_ID || secrets.DRIVE_SOURCE_FOLDER_ID }}
          DRIVE_PROCESSED_FOLDER_ID: ${{ vars.DRIVE_PROCESSED_FOLDER_ID }}
          DRIVE_CATALOG_FOLDER_ID: ${{ vars.DRIVE_CATALOG_FOLDER_ID || secrets.DRIVE_CATALOG_FOLDER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRIVE_PUSH_CHANNEL_STATUS: ${{ needs.watch.outputs.status || 'unknown' }}
          DRIVE_PUSH_CHANNEL_STEP: ${{ needs.watch.outputs.step_outcome || needs.watch.result }}
        run: |
          mkdir -p "$DRIVE_RUN_DIR"
          python _BUILD/sync_drive.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          run=Path(os.environ["DRIVE_RUN_DIR"])
          plan=json.loads((run/"drive_sync_plan.json").read_text(encoding="utf-8"))
          manifest_id=(run/"manifest_file_id.txt").read_text(encoding="utf-8").strip()
          missing_titles=any(not all(entry.get("title",{}).get(lang) for lang in ("ITA","FR","ENG","NL","DE")) for entry in plan["next_manifest"]["products"].values())
          dirty=bool(plan["imported"] or plan["removed_folders"] or plan.get("rename_sources") or not manifest_id or missing_titles)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output:
              output.write(f"has_changes={str(dirty).lower()}\n")
              output.write(f"products_to_generate={len(plan['imported'])}\n")
          report=json.loads((run/"drive_sync_report.json").read_text(encoding="utf-8")); report["catalog_changed"]=dirty
          report["drive_push_channel"]={"status":os.environ["DRIVE_PUSH_CHANNEL_STATUS"],"workflow_step":os.environ["DRIVE_PUSH_CHANNEL_STEP"]}
          (run/"drive_sync_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Generate changed technical sheets with official engine
        if: steps.prepare.outputs.products_to_generate != '0'
        run: |
          mkdir -p "$DRIVE_GENERATED_DIR"
          python _BUILD/engine.py "$DRIVE_RUN_DIR/product_overrides.json" "$DRIVE_GENERATED_DIR" 06/06/2026
          python - <<'PY'
          import json, os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path("_BUILD").resolve()))
          from i18n import LANGS
          root = Path(os.environ["DRIVE_GENERATED_DIR"])
          products = json.loads(Path(os.environ["DRIVE_RUN_DIR"], "drive_sync_plan.json").read_text(encoding="utf-8"))["imported"]
          expected = len(products) * len(LANGS) * 2
          actual = sum(1 for path in root.rglob("*") if path.suffix in {".html", ".pdf"})
          if actual != expected:
              raise SystemExit(f"Expected {expected} outputs, found {actual}")
          for path in root.rglob("*.pdf"):
              if path.stat().st_size < 500:
                  raise SystemExit(f"PDF is unexpectedly small: {path}")
          PY
      - name: Run repository tests and whitespace validation
        run: |
          python -m unittest discover -s tests -v
          node --test tests/search.test.js
          git diff --check
      - name: Assemble and validate complete site bundle
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_IMPERSONATED_USER: ${{ secrets.GOOGLE_DRIVE_IMPERSONATED_USER }}
          DRIVE_CATALOG_FOLDER_ID: ${{ vars.DRIVE_CATALOG_FOLDER_ID || secrets.DRIVE_CATALOG_FOLDER_ID }}
        run: python _BUILD/build_site_bundle.py
      - name: Apply validated bundle to the checkout
        if: steps.prepare.outputs.has_changes == 'true'
        env:
          DRIVE_RUN_DIR: /tmp/technical-sheets-run
          SITE_BUNDLE_DIR: /tmp/technical-sheets-site
        run: python _BUILD/apply_site_bundle.py "$DRIVE_RUN_DIR/drive_sync_plan.json" "$SITE_BUNDLE_DIR"
      - name: Stage only catalog-owned paths
        id: staged
        if: steps.prepare.outputs.has_changes == 'true'
        env:
          DRIVE_RUN_DIR: /tmp/technical-sheets-run
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("_BUILD").resolve()))
          from build_index import load_static_titles
          plan=json.loads(Path(os.environ["DRIVE_RUN_DIR"],"drive_sync_plan.json").read_text(encoding="utf-8"))
          paths={"index.html","house-of-tartufo-logo.png","vercel.json"}
          paths.update(load_static_titles())
          paths.update(plan["active_products"])
          paths.update(plan["removed_folders"])
          subprocess.run(["git","add","-A","--",*sorted(paths)],check=True)
          changed=subprocess.run(["git","diff","--cached","--quiet"])
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output:
              output.write(f"has_commit={str(changed.returncode != 0).lower()}\n")
          if changed.returncode not in (0,1):
              raise SystemExit(changed.returncode)
          PY
      - name: Commit catalog update
        if: steps.staged.outputs.has_commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync processed supplier catalog"
      - name: Create Vercel preview branch
        id: branch
        if: steps.prepare.outputs.has_changes == 'true'
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            BRANCH="drive-sync-${GITHUB_RUN_ID}"
            git switch -c "$BRANCH"
          else
            BRANCH="${GITHUB_REF_NAME}"
            git fetch origin "$BRANCH"
            if [[ "${{ steps.staged.outputs.has_commit }}" == "true" ]]; then
              git rebase "origin/$BRANCH"
            fi
          fi
          if [[ "${{ steps.staged.outputs.has_commit }}" == "true" ]]; then
            git push origin "HEAD:refs/heads/$BRANCH"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "No site changes to publish from main."
            exit 0
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$GITHUB_REPOSITORY/tree/$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Wait for Vercel Git preview deployment
        id: preview
        if: steps.branch.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_SHA: ${{ steps.branch.outputs.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          owner,repo=os.environ["GITHUB_REPOSITORY"].split("/",1)
          sha=os.environ["PREVIEW_SHA"]
          headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          api=f"https://api.github.com/repos/{owner}/{repo}"
          query=urllib.parse.urlencode({"sha":sha,"per_page":100})
          deadline=time.monotonic()+900
          while time.monotonic()<deadline:
              request=urllib.request.Request(f"{api}/deployments?{query}",headers=headers)
              with urllib.request.urlopen(request,timeout=30) as response: deployments=json.load(response)
              candidates=[item for item in deployments if item.get("sha")==sha and item.get("environment","").lower()=="preview"]
              preview_url=None
              if candidates:
                  deployment=max(candidates,key=lambda item:item.get("created_at",""))
                  request=urllib.request.Request(f"{api}/deployments/{deployment['id']}/statuses?per_page=20",headers=headers)
                  with urllib.request.urlopen(request,timeout=30) as response: statuses=json.load(response)
                  if statuses:
                      latest=statuses[0]
                      if latest["state"] in {"failure","error","inactive"}:
                          raise SystemExit(f"Vercel preview deployment failed: {latest.get('description')}")
                      if latest["state"]=="success":
                          preview_url=latest.get("environment_url") or latest.get("target_url")
              if preview_url:
                  with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output: output.write(f"url={preview_url}\n")
                  print(preview_url)
              if preview_url: break
              time.sleep(10)
          else:
              raise SystemExit("Timed out waiting for a ready Vercel preview deployment")
          PY
      - name: Validate catalog bundle for the ready Vercel preview
        id: smoke
        if: steps.preview.outputs.url != ''
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          DRIVE_RUN_DIR: /tmp/technical-sheets-run
          SITE_BUNDLE_DIR: /tmp/technical-sheets-site
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan=json.loads(Path(os.environ["DRIVE_RUN_DIR"],"drive_sync_plan.json").read_text(encoding="utf-8"))
          root=Path(os.environ["SITE_BUNDLE_DIR"])
          if not os.environ["PREVIEW_URL"].startswith("https://"): raise RuntimeError("Vercel preview URL is invalid")
          html=(root/"index.html").read_text(encoding="utf-8")
          for folder in plan["active_products"]:
              if folder not in html: raise RuntimeError(f"Active product missing from preview index: {folder}")
              for lang in ("ITA","FR","ENG","NL","DE"):
                  pdf=root/folder/f"{folder}_{lang}.pdf"
                  if not pdf.is_file() or pdf.stat().st_size < 500 or not pdf.read_bytes().startswith(b"%PDF-"):
                      raise RuntimeError(f"Invalid PDF in validated preview bundle: {pdf}")
          for folder in plan["removed_folders"]:
              if folder in html: raise RuntimeError(f"Removed product remains in preview index: {folder}")
          PY
      - name: Promote validated catalog commit to main
        id: production
        if: success() && (steps.smoke.outcome == 'success' || (steps.prepare.outputs.has_changes == 'true' && steps.staged.outputs.has_commit != 'true')) && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_to_production == 'true')
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          SITE_COMMIT: ${{ steps.branch.outputs.sha }}
        run: |
          if [[ -n "$SITE_COMMIT" ]]; then
            git fetch origin main
            git merge-base --is-ancestor origin/main "$SITE_COMMIT" || { echo "main advanced while preview was building; leaving it untouched"; exit 1; }
            git push origin "$SITE_COMMIT:refs/heads/main"
          fi
          echo "url=https://technical.houseoftartufo.com" >> "$GITHUB_OUTPUT"
      - name: Verify official production catalog
        if: success() && steps.production.outcome == 'success'
        env:
          DRIVE_RUN_DIR: /tmp/technical-sheets-run
          PRODUCTION_URL: https://technical.houseoftartufo.com
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path
          plan=json.loads(Path(os.environ["DRIVE_RUN_DIR"],"drive_sync_plan.json").read_text(encoding="utf-8"))
          base=os.environ["PRODUCTION_URL"].rstrip("/")
          deadline=time.monotonic()+900
          last_error=None
          while time.monotonic()<deadline:
              try:
                  req=urllib.request.Request(base+"/index.html?drive_sync="+str(time.time_ns()))
                  with urllib.request.urlopen(req,timeout=30) as response:
                      html=response.read().decode("utf-8")
                      if response.status!=200: raise RuntimeError(f"index returned HTTP {response.status}")
                  missing=[folder for folder in plan["active_products"] if folder not in html]
                  removed=[folder for folder in plan["removed_folders"] if folder in html]
                  if missing or removed: raise RuntimeError(f"catalog mismatch; missing={missing}, removed still present={removed}")
                  for folder in plan["active_products"]:
                      for lang in ("ITA","FR","ENG","NL","DE"):
                          url=f"{base}/{folder}/{folder}_{lang}.pdf"
                          with urllib.request.urlopen(url,timeout=30) as response:
                              data=response.read()
                              if response.status!=200 or not data.startswith(b"%PDF-"):
                                  raise RuntimeError(f"public PDF failed validation: {url}")
                  print(f"Verified {len(plan['active_products'])} products on official site")
                  break
              except Exception as exc:
                  last_error=exc
                  time.sleep(20)
          else:
              raise SystemExit(f"Official deployment was not verified: {last_error}")
          PY
      - name: Delete temporary preview branch
        if: success() && steps.production.outcome == 'success' && startsWith(steps.branch.outputs.name, 'drive-sync-')
        continue-on-error: true
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: git push origin --delete "$BRANCH_NAME"
      - name: Finalize Drive state
        id: finalize
        if: success() && steps.production.outcome == 'success'
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_IMPERSONATED_USER: ${{ secrets.GOOGLE_DRIVE_IMPERSONATED_USER }}
          DRIVE_CATALOG_FOLDER_ID: ${{ vars.DRIVE_CATALOG_FOLDER_ID || secrets.DRIVE_CATALOG_FOLDER_ID }}
          DRIVE_SOURCE_FOLDER_ID: ${{ vars.DRIVE_SOURCE_FOLDER_ID || secrets.DRIVE_SOURCE_FOLDER_ID }}
          DRIVE_PROCESSED_FOLDER_ID: ${{ vars.DRIVE_PROCESSED_FOLDER_ID }}
          DRIVE_RUN_DIR: /tmp/technical-sheets-run
          DRIVE_GENERATED_DIR: /tmp/technical-sheets-generated
        run: python _BUILD/finalize_drive_sync.py
      - name: Record workflow outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PREVIEW_STATUS: ${{ steps.preview.outcome }}
          SMOKE_STATUS: ${{ steps.smoke.outcome }}
          PRODUCTION_STATUS: ${{ steps.production.outcome }}
          DRIVE_STATUS: ${{ steps.finalize.outcome }}
          WATCH_STATUS: ${{ needs.watch.outputs.step_outcome || needs.watch.result }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          BRANCH_URL: ${{ steps.branch.outputs.url }}
          PRODUCTION_URL: https://technical.houseoftartufo.com
        run: |
          mkdir -p "$DRIVE_RUN_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ["DRIVE_RUN_DIR"])/"drive_sync_report.json"
          report=json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"status":"failed_before_prepare"}
          report["workflow_status"]=os.environ["JOB_STATUS"]
          report["stages"]={"drive_push_channel":os.environ.get("WATCH_STATUS"),"preview":os.environ.get("PREVIEW_STATUS"),"smoke_test":os.environ.get("SMOKE_STATUS"),"production":os.environ.get("PRODUCTION_STATUS"),"drive_finalize":os.environ.get("DRIVE_STATUS")}
          for key,value in (("preview_deployment_url",os.environ.get("PREVIEW_URL")),("preview_branch_url",os.environ.get("BRANCH_URL")),("production_deployment_url",os.environ.get("PRODUCTION_URL"))):
              if value: report[key]=value
          path.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Save Drive sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-sync-report-${{ github.run_id }}
          path: /tmp/technical-sheets-run/drive_sync_report.json
          if-no-files-found: warn
