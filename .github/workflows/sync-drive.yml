name: Sync supplier technical sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install importer dependencies
        run: pip install google-api-python-client google-auth openai
      - name: Read, translate and validate supplier sheets
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_SOURCE_FOLDER_ID: ${{ vars.DRIVE_SOURCE_FOLDER_ID }}
          DRIVE_CATALOG_FOLDER_ID: ${{ vars.DRIVE_CATALOG_FOLDER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python _BUILD/sync_drive.py
      - name: Generate official HTML and PDF files
        run: |
          python _BUILD/cleanup_removed.py
          python _BUILD/engine.py _BUILD/product_overrides.json . 06/06/2026
          python _BUILD/build_index.py
          git diff --check
          test "$(find . -mindepth 2 -name '*.pdf' | wc -l)" -ge 135
          for pdf in $(find . -mindepth 2 -name '*.pdf'); do
            pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
            test "$pages" = "2"
          done
      - name: Publish generated files to Google Drive
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_CATALOG_FOLDER_ID: ${{ vars.DRIVE_CATALOG_FOLDER_ID }}
        run: python _BUILD/publish_drive.py
      - name: Publish generated catalog
        run: |
          git config user.name "houseoftartufo-drive-sync"
          git config user.email "admin@houseoftartufo.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: sync supplier technical sheets"
          git push origin main
