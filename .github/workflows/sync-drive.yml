name: Sync supplier technical sheets

on:
  workflow_dispatch:
    inputs:
      publish_to_production:
        description: Publish to the official site after the preview smoke test (available only from main)
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: supplier-drive-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DRIVE_RUN_DIR: /tmp/technical-sheets-run
      DRIVE_GENERATED_DIR: /tmp/technical-sheets-generated
      SITE_BUNDLE_DIR: /tmp/technical-sheets-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install importer and PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 poppler-utils libreoffice-writer
          pip install -r requirements-drive.txt
          npm install --global vercel@48.1.0
      - name: Prepare sync run
        id: prepare
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_IMPERSONATED_USER: ${{ secrets.GOOGLE_DRIVE_IMPERSONATED_USER }}
          DRIVE_SOURCE_FOLDER_ID: ${{ vars.DRIVE_SOURCE_FOLDER_ID || secrets.DRIVE_SOURCE_FOLDER_ID }}
          DRIVE_CATALOG_FOLDER_ID: ${{ vars.DRIVE_CATALOG_FOLDER_ID || secrets.DRIVE_CATALOG_FOLDER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p "$DRIVE_RUN_DIR"
          python _BUILD/sync_drive.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          run=Path(os.environ["DRIVE_RUN_DIR"])
          plan=json.loads((run/"drive_sync_plan.json").read_text(encoding="utf-8"))
          manifest_id=(run/"manifest_file_id.txt").read_text(encoding="utf-8").strip()
          missing_titles=any(not all(entry.get("title",{}).get(lang) for lang in ("ITA","FR","ENG","NL","DE")) for entry in plan["next_manifest"]["products"].values())
          dirty=bool(plan["imported"] or plan["removed_folders"] or not manifest_id or missing_titles or os.environ["GITHUB_EVENT_NAME"]=="push")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output: output.write(f"has_changes={str(dirty).lower()}\n")
          report=json.loads((run/"drive_sync_report.json").read_text(encoding="utf-8")); report["catalog_changed"]=dirty
          (run/"drive_sync_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Generate changed technical sheets with official engine
        run: |
          mkdir -p "$DRIVE_GENERATED_DIR"
          python _BUILD/engine.py "$DRIVE_RUN_DIR/product_overrides.json" "$DRIVE_GENERATED_DIR" 06/06/2026
          python - <<'PY'
          import json, os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path("_BUILD").resolve()))
          from i18n import LANGS
          root = Path(os.environ["DRIVE_GENERATED_DIR"])
          products = json.loads(Path(os.environ["DRIVE_RUN_DIR"], "drive_sync_plan.json").read_text(encoding="utf-8"))["imported"]
          expected = len(products) * len(LANGS) * 2
          actual = sum(1 for path in root.rglob("*") if path.suffix in {".html", ".pdf"})
          if actual != expected:
              raise SystemExit(f"Expected {expected} outputs, found {actual}")
          for path in root.rglob("*.pdf"):
              if path.stat().st_size < 500:
                  raise SystemExit(f"PDF is unexpectedly small: {path}")
          PY
          python -m unittest discover -s tests -v
          node --test tests/search.test.js
          git diff --check
      - name: Assemble and validate complete site bundle
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_IMPERSONATED_USER: ${{ secrets.GOOGLE_DRIVE_IMPERSONATED_USER }}
          DRIVE_CATALOG_FOLDER_ID: ${{ vars.DRIVE_CATALOG_FOLDER_ID || secrets.DRIVE_CATALOG_FOLDER_ID }}
        run: python _BUILD/build_site_bundle.py
      - name: Link Vercel project non-interactively
        if: steps.prepare.outputs.has_changes == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel link --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --yes --token "$VERCEL_TOKEN"
      - name: Deploy Vercel preview
        if: steps.prepare.outputs.has_changes == 'true'
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          url=$(vercel deploy "$SITE_BUNDLE_DIR" --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          python - "$DRIVE_RUN_DIR/drive_sync_report.json" "$url" <<'PY'
          import json, sys
          from pathlib import Path
          path=Path(sys.argv[1]); report=json.loads(path.read_text(encoding="utf-8"))
          report["preview_deployment_url"]=sys.argv[2]
          path.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Smoke-test preview
        id: smoke
        if: steps.prepare.outputs.has_changes == 'true'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          DRIVE_RUN_DIR: /tmp/technical-sheets-run
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          base=os.environ["PREVIEW_URL"].rstrip("/")
          def check(path):
              with urllib.request.urlopen(base + "/" + path, timeout=30) as response:
                  if response.status != 200: raise RuntimeError(f"HTTP {response.status}: {path}")
                  return response.read()
          check("index.html")
          plan=json.loads(Path(os.environ["DRIVE_RUN_DIR"], "drive_sync_plan.json").read_text(encoding="utf-8"))
          for folder in plan["active_products"]:
              for lang in ("ITA", "FR", "ENG", "NL", "DE"):
                  check(f"{folder}/{folder}_{lang}.pdf")
          PY
      - name: Deploy Vercel production
        if: steps.prepare.outputs.has_changes == 'true' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_to_production == 'true')
        id: production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          DRIVE_RUN_DIR: /tmp/technical-sheets-run
        run: |
          url=$(vercel deploy "$SITE_BUNDLE_DIR" --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          python - "$DRIVE_RUN_DIR/drive_sync_report.json" "$url" <<'PY'
          import json, sys
          from pathlib import Path
          path=Path(sys.argv[1]); report=json.loads(path.read_text(encoding="utf-8"))
          report["production_deployment_url"]=sys.argv[2]
          path.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Finalize Drive state
        id: finalize
        if: success() && steps.production.outcome == 'success'
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_IMPERSONATED_USER: ${{ secrets.GOOGLE_DRIVE_IMPERSONATED_USER }}
          DRIVE_CATALOG_FOLDER_ID: ${{ vars.DRIVE_CATALOG_FOLDER_ID || secrets.DRIVE_CATALOG_FOLDER_ID }}
          DRIVE_SOURCE_FOLDER_ID: ${{ vars.DRIVE_SOURCE_FOLDER_ID || secrets.DRIVE_SOURCE_FOLDER_ID }}
          DRIVE_RUN_DIR: /tmp/technical-sheets-run
          DRIVE_GENERATED_DIR: ${{ runner.temp }}/technical-sheets-generated
        run: python _BUILD/finalize_drive_sync.py
      - name: Record workflow outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PREVIEW_STATUS: ${{ steps.preview.outcome }}
          SMOKE_STATUS: ${{ steps.smoke.outcome }}
          PRODUCTION_STATUS: ${{ steps.production.outcome }}
          DRIVE_STATUS: ${{ steps.finalize.outcome }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PRODUCTION_URL: ${{ steps.production.outputs.url }}
        run: |
          mkdir -p "$DRIVE_RUN_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ["DRIVE_RUN_DIR"])/"drive_sync_report.json"
          report=json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"status":"failed_before_prepare"}
          report["workflow_status"]=os.environ["JOB_STATUS"]
          report["stages"]={"preview":os.environ.get("PREVIEW_STATUS"),"smoke_test":os.environ.get("SMOKE_STATUS"),"production":os.environ.get("PRODUCTION_STATUS"),"drive_finalize":os.environ.get("DRIVE_STATUS")}
          if os.environ.get("PREVIEW_URL"): report["preview_deployment_url"]=os.environ["PREVIEW_URL"]
          if os.environ.get("PRODUCTION_URL"): report["production_deployment_url"]=os.environ["PRODUCTION_URL"]
          path.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Save Drive sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-sync-report-${{ github.run_id }}
          path: /tmp/technical-sheets-run/drive_sync_report.json
          if-no-files-found: warn
